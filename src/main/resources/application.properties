spring.application.name=backend
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/projets_tutores?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:sql/schema.sql,classpath:sql/migration-connexion.sql
spring.jackson.deserialization.accept-float-as-int=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'
